services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui:latest
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOME: /app/backend/data
      WEBUI_BIND_HOST: ${WEBUI_BIND_HOST:-0.0.0.0}
      WEBUI_PORT: ${WEBUI_PORT:-8080}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ./data
        target: /app/backend/data
        read_only: false
      - type: bind
        source: ./.env
        target: /app/backend/data/.env
        read_only: true
    tmpfs:
      - /tmp:rw,size=512m
      - /run:rw,size=64m
    ports:
      - "${WEBUI_BIND_HOST:-0.0.0.0}:${WEBUI_HOST_PORT:-15080}:8080"
      - "${WEBUI_SSH_BIND_HOST:-0.0.0.0}:${WEBUI_SSH_HOST_PORT:-15021}:22"
